# Eventcast Pro — Scheduled Cron Jobs
#
# The eventcast-admin app runs on Cloudflare Workers (OpenNext build,
# Worker "eventcast-admin-worker"), which has no native cron trigger wired
# to these Next.js routes. This GitHub Actions workflow acts as the
# external scheduler instead, calling the Worker's cron API endpoints on a
# fixed schedule.
#
# ADMIN_BASE_URL intentionally targets the Worker's own
# *.workers.dev hostname, NOT the human-facing production URL
# (https://studio.eventcast.pro) — that zone's Bot Fight Mode challenges
# non-browser traffic like a GitHub Actions runner, while workers.dev sits
# outside the zone entirely. Both hostnames serve the exact same Worker and
# code; only the routing differs.
#
# Required GitHub Secrets (Settings → Secrets → Actions):
#   CRON_SECRET        — same value as the CRON_SECRET binding configured on eventcast-admin-worker
#   ADMIN_BASE_URL     — https://eventcast-admin-worker.<account>.workers.dev (NOT studio.eventcast.pro)
#
# Schedule (all times UTC — IST = UTC+05:30):
#   event-lifecycle-sweep → daily at 03:00 UTC / 08:30 IST (Draft 7-day
#                           auto-archive + Archived-Draft 30-day
#                           auto-permanent-delete). Reuses the same
#                           CRON_SECRET — no new secret required.
#
# The legacy sync-live-status job (YouTube title/status sync for the retired
# platform-channel YouTube integration) was retired: all of its legacy
# broadcasts are historical (event_date already in the past), no current or
# upcoming EventCast event depends on it, and its underlying route
# (/api/cron/sync-live-status) and the legacy Google OAuth credential
# dependency it exercised were removed from application code in the same
# change. Future YouTube synchronization belongs to the separate,
# not-yet-started OAuth-connected YouTube Destinations package.

name: Eventcast Cron Jobs

on:
  schedule:
    # ── event-lifecycle-sweep: once daily ───────────────────────────────────
    - cron: '0 3 * * *'

  # Allow manual triggering from the Actions tab for debugging
  workflow_dispatch:
    inputs:
      job:
        description: 'Which cron to run manually'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - sync-live-status
          - event-lifecycle-sweep

jobs:
  # ── Event Lifecycle sweep ──────────────────────────────────────────
  event-lifecycle-sweep:
    name: Event Lifecycle Sweep (Draft auto-archive + Archived-Draft auto-delete)
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.job == 'event-lifecycle-sweep' || github.event.inputs.job == 'both')) ||
      (github.event_name == 'schedule' && github.event.schedule == '0 3 * * *')

    steps:
      - name: Call event-lifecycle-sweep endpoint
        env:
          ADMIN_BASE_URL: ${{ secrets.ADMIN_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "⏰ Calling event-lifecycle-sweep at $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          HTTP_STATUS=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            "${ADMIN_BASE_URL}/api/cron/event-lifecycle-sweep?secret=${CRON_SECRET}")
          echo "HTTP Status: $HTTP_STATUS"
          cat /tmp/response.json
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "❌ event-lifecycle-sweep returned HTTP $HTTP_STATUS"
            exit 1
          fi
          echo "✅ event-lifecycle-sweep completed successfully"
