name: livestream-infra CI

# Path-scoped: this workflow exists only for the livestream-infra media
# pipeline (Go Media Agent + Docker/Compose media-node deployment). It
# must never gate or trigger any EventCast frontend, Cloudflare Pages, or
# Vercel deployment job, and it must never require the GCP validation VM
# or production credentials for a normal pull request - every job below
# runs entirely on the GitHub-hosted runner against public, pinned images
# and a synthetic local stream.
on:
  pull_request:
    paths:
      - "livestream-infra/**"
      - ".github/workflows/media-agent-release.yml"
      - ".github/workflows/livestream-infra-ci.yml"
  push:
    branches: [main]
    paths:
      - "livestream-infra/**"
      - ".github/workflows/media-agent-release.yml"
      - ".github/workflows/livestream-infra-ci.yml"

# A newer push/PR update supersedes an in-flight run for the same ref.
concurrency:
  group: livestream-infra-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default; no job below needs to write anything.
permissions:
  contents: read

jobs:
  go:
    name: gofmt / vet / build / test / race
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Pinned exact Go toolchain image (tag AND digest), matching
    # services/media-agent/Dockerfile and 04_TECH_STACK_AND_VERSION_POLICY.md.
    container:
      image: golang:1.26.4@sha256:f96cc555eb8db430159a3aa6797cd5bae561945b7b0fe7d0e284c63a3b291609
    defaults:
      run:
        working-directory: livestream-infra/services/media-agent
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "$out"
            echo "::error::gofmt found unformatted file(s) above; run 'gofmt -w .'"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # -buildvcs=false: this job runs inside a container image with the
      # checkout bind-mounted from the runner, so the repo directory's
      # owning UID does not match the container user. Git refuses to
      # operate on it (dubious ownership), and Go's automatic VCS
      # stamping then fails the entire build with "error obtaining VCS
      # status: exit status 128" even though nothing is wrong with the
      # source itself. This only affects embedded build metadata, not
      # program behavior; the actual deployed image comes from the
      # separate "build media-agent image" job (a plain docker build,
      # no bind mount), which is unaffected.
      - name: go build
        run: go build -buildvcs=false ./...

      # internal/store/migrations_test.go applies every versioned
      # migration in migrations/*.sql against a real SQLite database as
      # part of this run, so a dedicated "migrations" job is unnecessary.
      - name: go test
        run: go test -buildvcs=false ./...

      - name: go test -race
        run: go test -buildvcs=false -race ./...

  shell-syntax:
    name: shell syntax (infra/media-node scripts)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: bash -n every script
        run: |
          set -e
          status=0
          while IFS= read -r -d '' f; do
            echo "checking $f"
            bash -n "$f" || status=1
          done < <(find livestream-infra/infra/media-node/compose -name '*.sh' -print0)
          exit "$status"

  compose-render:
    name: docker compose config render
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: render compose configs against the example environment
        working-directory: livestream-infra/infra/media-node/compose
        run: |
          set -e
          cp .env.example .env
          # Production Compose deliberately has no default image. This
          # non-routable, digest-shaped value exists only for config rendering.
          export MEDIA_AGENT_IMAGE='example.invalid/eventcast-media-agent@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'
          docker compose -f docker-compose.yml config >/dev/null
          # The test-only overlay requires two variables with no default
          # (media-delivery-integration-test.sh always supplies its own
          # unique temp path/file at runtime); a fixed placeholder is
          # enough to prove the overlay merges and interpolates cleanly.
          MINIO_DATA_HOST_DIR=/tmp/ci-minio-data \
          RELAY_SINK_CONF_HOST_PATH=../srs/relay-sink.conf \
            docker compose -f docker-compose.yml -f docker-compose.media-delivery-test.yml config >/dev/null

  docker-build:
    name: build media-agent image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: docker build
        run: |
          docker build \
            --build-arg "MEDIA_AGENT_VERSION=ci-${{ github.sha }}" \
            -t media-agent:ci \
            livestream-infra/services/media-agent

  integration:
    name: deterministic integration test (SRS + MinIO + relay sink)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [go]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Builds its own isolated media-agent image, uniquely-named
      # Compose project, network, containers, and temp directories; a
      # real (but ephemeral, local, non-production) MinIO container
      # stands in for R2 and a second pinned SRS instance stands in for
      # YouTube. No production credentials of any kind are used or
      # required. See the script's own header comment for the full list
      # of behavior it proves.
      - name: run media-delivery-integration-test.sh
        run: livestream-infra/infra/media-node/compose/media-delivery-integration-test.sh

  release-workflow-policy:
    name: static policy checks (release workflow)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: static policy checks for release workflow
        shell: bash
        run: |
          set -euo pipefail
          wf=".github/workflows/media-agent-release.yml"
          rel="livestream-infra/services/media-agent/releases"
          err=0
          rc=0

          require_match() {
            local label="$1" file="$2" pattern="$3" rc
            grep -qE "$pattern" "$file" && rc=0 || rc=$?
            if   [[ $rc -ge 2 ]]; then printf 'ERROR (grep): %s\n' "$label" >&2; exit 1
            elif [[ $rc -ne 0 ]]; then printf 'FAIL [require]: %s\n' "$label" >&2; err=$((err+1))
            else                        printf 'pass: %s\n' "$label"
            fi
          }

          forbid_match() {
            local label="$1" file="$2" pattern="$3" rc
            grep -qE "$pattern" "$file" && rc=0 || rc=$?
            if   [[ $rc -ge 2 ]]; then printf 'ERROR (grep): %s\n' "$label" >&2; exit 1
            elif [[ $rc -eq 0 ]]; then printf 'FAIL [forbid]: %s\n' "$label" >&2; err=$((err+1))
            else                        printf 'pass: %s\n' "$label"
            fi
          }

          # 1. previous_image_reference input is required: true
          require_match \
            "previous_image_reference input key present" "$wf" \
            'previous_image_reference:[[:space:]]*$'
          grep -A10 'previous_image_reference:' "$wf" | grep -q 'required: true' && rc=0 || rc=$?
          [[ $rc -lt 2 ]] || { echo "ERROR (grep): required:true check" >&2; exit 1; }
          [[ $rc -eq 0 ]] || { echo "FAIL [require]: required: true for previous_image_reference" >&2; err=$((err+1)); }

          # 2. Evidence format field is release-v2
          require_match \
            "evidence format is release-v2" "$wf" \
            "printf 'format=eventcast-media-agent-release-v2"

          # 3. Package metadata gate expects HTTP 200
          require_match \
            "package metadata gate expects HTTP 200" "$wf" \
            '"200" \]\] \|\| \{'

          # 4. Visibility check requires the string private (single-quoted in jq comparison)
          require_match \
            "visibility check requires string private" "$wf" \
            "'private'"

          # 5. No HTTP 404 authorization path present
          forbid_match \
            "no HTTP 404 authorization path (double-quote)" "$wf" '"404"'
          forbid_match \
            "no HTTP 404 authorization path (single-quote)" "$wf" "'404'"

          # 6. Tag uniqueness check uses the Packages versions API endpoint
          require_match \
            "tag uniqueness uses Packages versions API" "$wf" \
            'packages/container/\$\{?PACKAGE_NAME\}?/versions'

          # 7. Old public package name (without -private suffix) is absent
          forbid_match \
            "old public package name absent" "$wf" \
            'ghcr\.io/renugopal/eventcast-media-agent[^-]'

          # 8. v1.0.0 release evidence is byte-for-byte unchanged
          echo "9ce9ae5cda9543d400847e802c05bb364098359aaf6595c0965fe8d84165730e  ${rel}/eventcast-media-agent-v1.0.0-1e6142d9b5b1.release" \
            | sha256sum --check --strict --quiet && rc=0 || rc=$?
          if [[ $rc -ne 0 ]]; then
            echo "FAIL: v1.0.0 release evidence has changed" >&2; err=$((err+1))
          else
            echo "pass: v1.0.0 release evidence is byte-for-byte unchanged"
          fi

          [[ "$err" -eq 0 ]] || { printf '%d static policy check(s) failed\n' "$err" >&2; exit 1; }

  actionlint:
    name: actionlint (workflow linting)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: install and run actionlint
        shell: bash
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --silent --fail --location \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}" \
            --output "$archive"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" actionlint
          rm "$archive"
          ./actionlint \
            .github/workflows/media-agent-release.yml \
            .github/workflows/livestream-infra-ci.yml
