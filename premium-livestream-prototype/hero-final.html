<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="description" content="Watch the sacred union of Aravind & Meghana live — a premium wedding livestream experience."/>
  <meta name="theme-color" content="#f7f0e6"/>
  <title>Aravind &amp; Meghana — Live Wedding Celebration</title>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,200;0,300;0,400;1,200;1,300;1,400&family=Jost:wght@300;400;500;600&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet"/>

  <style>
  /* ─────────────────────────────────────────────────────
     TOKENS
  ───────────────────────────────────────────────────── */
  :root {
    --gold:       #b8922f;
    --gold-mid:   #c9a84c;
    --gold-light: #d4aa5a;
    --gold-pale:  #e8d5a3;
    --rust:       #7b4b1c;
    --text-dark:  #281608;
    --text-warm:  #3a2412;
    --text-muted: #7a5e44;
    --cream-92:   rgba(253,248,241,0.92);
    --cream-82:   rgba(253,248,241,0.82);
    --serif:      'Cormorant Garamond', Georgia, serif;
    --italic:     'IM Fell English', Georgia, serif;
    --sans:       'Jost', system-ui, sans-serif;
    --ease-out:   cubic-bezier(0.16, 1, 0.3, 1);
    --ease:       cubic-bezier(0.25, 0.46, 0.45, 0.94);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; }

  body {
    font-family: var(--sans);
    background: #f5e8d5;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ─────────────────────────────────────────────────────
     KEYFRAMES
  ───────────────────────────────────────────────────── */
  @keyframes fuD {
    from { opacity: 0; transform: translateY(-16px); }
    to   { opacity: 1; transform: none; }
  }
  @keyframes fuU {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: none; }
  }
  @keyframes fIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  @keyframes ruleGrow {
    from { width: 0; opacity: 0; }
    to   { width: 64px; opacity: 1; }
  }
  @keyframes scrollBob {
    0%, 100% { transform: translateY(0);   opacity: 1; }
    60%       { transform: translateY(8px); opacity: 0.3; }
  }
  @keyframes pulseDot {
    0%, 100% { box-shadow: 0 0 0 0   rgba(239,68,68,0.8); }
    60%       { box-shadow: 0 0 0 9px rgba(239,68,68,0);   }
  }
  /* Ambient glow on the CTA */
  @keyframes ctaGlow {
    0%, 100% {
      box-shadow:
        0 0 0 0  rgba(184,146,47,0),
        0 10px 40px rgba(184,146,47,0.45),
        inset 0 1px 0 rgba(255,255,255,0.20);
    }
    50% {
      box-shadow:
        0 0 0 8px rgba(184,146,47,0.10),
        0 14px 56px rgba(184,146,47,0.62),
        inset 0 1px 0 rgba(255,255,255,0.22);
    }
  }
  /* Shimmer sweep across CTA */
  @keyframes shimmer {
    0%       { left: -120%; }
    40%, 100% { left:  160%; }
  }
  /* Outer ring pulse behind the CTA */
  @keyframes ringPulse {
    0%, 100% { transform: scale(1);    opacity: 0.55; }
    50%       { transform: scale(1.06); opacity: 0;    }
  }

  /* ─────────────────────────────────────────────────────
     HERO WRAPPER
  ───────────────────────────────────────────────────── */
  #hero {
    position: relative;
    width: 100%;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ─────────────────────────────────────────────────────
     BACKGROUND — exact image, untouched
  ───────────────────────────────────────────────────── */
  .hero-bg {
    position: absolute;
    inset: 0;
    background-image: url('./assets/hero_bg.png');
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
    z-index: 0;
  }
  /*
     A single, very gentle luminosity lift only in the
     elliptical center — just enough to lift text contrast
     without touching the artwork. Radial is transparent
     at all edges so artwork composition is fully preserved.
  */
  .hero-bg::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(
      ellipse 72% 48% at 50% 38%,
      rgba(253,248,241,0.16) 0%,
      transparent 100%
    );
    pointer-events: none;
  }

  /* ─────────────────────────────────────────────────────
     HERO CONTENT — vertically fills safe (sky) area
  ───────────────────────────────────────────────────── */
  .hero-body {
    position: relative;
    z-index: 2;
    /*
       The sky/safe zone is ~0%–67% of viewport height.
       All interactive content lives here.
       Top padding: clears safe-area (notch) + desired breathing room.
    */
    padding-top: max(44px, env(safe-area-inset-top, 44px));
    padding-left: 28px;
    padding-right: 28px;
    padding-bottom: 0;

    /* Flex: column, centered horizontally */
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;

    /* Constrain height to the safe sky area */
    max-height: 67svh;
    justify-content: space-evenly;
  }

  /* ─────────────────────────────────────────────────────
     1. OM + BLESSING — topmost, smallest, delicate
  ───────────────────────────────────────────────────── */
  .blessing-row {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    opacity: 0;
    animation: fuD 1.1s var(--ease-out) 0.1s forwards;
  }
  .om-symbol {
    font-size: 22px;
    line-height: 1;
    color: var(--gold-mid);
  }
  .blessing-text {
    font-family: var(--serif);
    font-style: italic;
    font-size: 11.5px;
    font-weight: 300;
    color: var(--rust);
    letter-spacing: 0.13em;
  }

  /* ─────────────────────────────────────────────────────
     ORNAMENTAL RULE
  ───────────────────────────────────────────────────── */
  .ornament-rule {
    width: 64px;
    height: 1px;
    background: linear-gradient(
      to right,
      transparent,
      var(--gold-light),
      transparent
    );
    opacity: 0;
    animation: ruleGrow 1.2s var(--ease-out) 0.5s forwards;
    flex-shrink: 0;
  }

  /* ─────────────────────────────────────────────────────
     2. COUPLE NAMES — primary visual anchor
        Reduced 17% from previous: clamp(60px, 17vw, 80px)
  ───────────────────────────────────────────────────── */
  .names-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    opacity: 0;
    animation: fuU 1.4s var(--ease-out) 0.52s forwards;
  }
  .couple-name {
    font-family: var(--serif);
    font-weight: 300;
    /* Previous: clamp(72px, 20.5vw, 96px). Now 17% smaller. */
    font-size: clamp(60px, 17vw, 80px);
    line-height: 0.92;
    letter-spacing: -0.02em;
    color: var(--text-dark);
    display: block;
  }
  .weds-text {
    font-family: var(--italic);
    font-style: italic;
    font-size: clamp(14px, 4vw, 17px);
    color: var(--gold);
    letter-spacing: 0.28em;
    display: block;
    margin: 8px 0 6px;
    position: relative;
    /* Flanking gold hairlines */
  }
  .weds-text::before,
  .weds-text::after {
    content: '';
    position: absolute;
    top: 50%;
    width: 18px;
    height: 1px;
    background: rgba(184,146,47,0.45);
  }
  .weds-text::before { right: calc(50% + 30px); }
  .weds-text::after  { left:  calc(50% + 30px); }

  /* ─────────────────────────────────────────────────────
     3. EVENT DETAILS — date pill, sumuhurtham, venue
  ───────────────────────────────────────────────────── */
  .event-details {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    opacity: 0;
    animation: fuU 1.1s var(--ease-out) 0.82s forwards;
  }
  .date-pill {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: var(--cream-82);
    border: 1px solid rgba(184,146,47,0.30);
    border-radius: 50px;
    padding: 8px 20px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow:
      0 2px 14px rgba(44,20,4,0.07),
      inset 0 1px 0 rgba(255,255,255,0.60);
  }
  .date-pill span {
    font-size: 12px;
    font-weight: 400;
    letter-spacing: 0.13em;
    color: var(--text-warm);
  }
  .date-pill .dp {
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: var(--gold-mid);
    flex-shrink: 0;
  }
  .sumuhurtham-line {
    font-family: var(--serif);
    font-style: italic;
    font-size: 13px;
    font-weight: 300;
    color: var(--rust);
    letter-spacing: 0.09em;
  }
  /*
     Venue: one balanced line on most phones.
     Two balanced lines on narrower (≤360px) screens.
     max-width ensures wrapping is centred and symmetrical.
  */
  .venue-line {
    font-size: 10px;
    font-weight: 400;
    letter-spacing: 0.17em;
    text-transform: uppercase;
    color: var(--text-muted);
    max-width: 260px;
    line-height: 1.55;
    text-align: center;
  }

  /* ─────────────────────────────────────────────────────
     4. COUNTDOWN — sits fully in the sky safe zone
  ───────────────────────────────────────────────────── */
  .countdown-row {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    justify-content: center;
    opacity: 0;
    animation: fuU 1.1s var(--ease-out) 1.06s forwards;
  }
  .cd-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
  }
  .cd-num {
    font-family: var(--serif);
    /* Slightly compact from before to keep in safe zone */
    font-size: clamp(34px, 9.5vw, 46px);
    font-weight: 300;
    line-height: 1;
    color: var(--text-dark);

    /* Frosted glass tile */
    width:  clamp(62px, 17.5vw, 74px);
    height: clamp(62px, 17.5vw, 74px);
    background: var(--cream-92);
    border: 1px solid rgba(184,146,47,0.28);
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow:
      0 4px 18px rgba(44,20,4,0.09),
      inset 0 1px 0 rgba(255,255,255,0.72),
      inset 0 -1px 0 rgba(184,146,47,0.07);
  }
  .cd-label {
    font-size: 8px;
    font-weight: 500;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--text-muted);
  }
  .cd-sep {
    font-family: var(--serif);
    font-size: 26px;
    color: rgba(184,146,47,0.52);
    /* Align colon to mid-tile height */
    margin-top: 16px;
    flex-shrink: 0;
    line-height: 1;
  }

  /* ─────────────────────────────────────────────────────
     5. WATCH LIVE BUTTON — most prominent CTA
        Three-layer treatment: outer ring + button + shimmer
  ───────────────────────────────────────────────────── */
  .cta-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
    opacity: 0;
    animation: fuU 1.1s var(--ease-out) 1.3s forwards;
    position: relative;
  }

  /* Pulsing halo ring behind the button */
  .cta-ring {
    position: absolute;
    inset: -6px;
    border-radius: 66px;
    border: 1.5px solid rgba(184,146,47,0.45);
    animation: ringPulse 2.8s ease-in-out 2.8s infinite;
    pointer-events: none;
  }

  .cta-btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 13px;

    /* Larger padding = more visual weight */
    padding: 19px 52px;
    min-width: 240px;

    background: linear-gradient(
      135deg,
      #dab85e 0%,
      #c9a43a 25%,
      #b8922f 65%,
      #9e7820 100%
    );
    color: #fff;
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    border-radius: 60px;
    border: none;
    text-decoration: none;
    cursor: pointer;

    /* Strong initial shadow + cycling glow */
    box-shadow:
      0 10px 44px rgba(184,146,47,0.50),
      0 3px 0 rgba(120,80,10,0.25),
      inset 0 1px 0 rgba(255,255,255,0.22);
    animation: ctaGlow 3.2s ease-in-out 2.5s infinite;

    overflow: hidden;
  }

  /* Inner shimmer sweep */
  .cta-btn::before {
    content: '';
    position: absolute;
    top: 0;
    left: -120%;
    width: 55%;
    height: 100%;
    background: linear-gradient(
      90deg,
      transparent,
      rgba(255,255,255,0.18),
      transparent
    );
    animation: shimmer 4s ease-in-out 3.2s infinite;
  }

  /* Top-edge highlight for depth */
  .cta-btn::after {
    content: '';
    position: absolute;
    top: 0; left: 12%; right: 12%;
    height: 1px;
    background: linear-gradient(
      to right,
      transparent,
      rgba(255,255,255,0.38),
      transparent
    );
    border-radius: 1px;
  }

  /* Live pulse dot */
  .live-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #ef4444;
    flex-shrink: 0;
    animation: pulseDot 1.8s ease-in-out infinite;
  }

  /* Arrow icon */
  .cta-arrow {
    opacity: 0.72;
    flex-shrink: 0;
    transition: transform 0.2s var(--ease);
  }
  .cta-btn:hover .cta-arrow {
    transform: translateX(3px);
  }

  /* ─────────────────────────────────────────────────────
     HERO FOOTER — scroll indicator, lives below safe zone
  ───────────────────────────────────────────────────── */
  .hero-footer {
    position: relative;
    z-index: 2;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    gap: 7px;
    padding-bottom: max(28px, env(safe-area-inset-bottom, 24px));
    opacity: 0;
    animation: fIn 1.2s var(--ease) 2s forwards;
  }
  .scroll-label {
    font-size: 8.5px;
    font-weight: 500;
    letter-spacing: 0.26em;
    text-transform: uppercase;
    color: var(--text-muted);
  }
  .scroll-mouse {
    width: 20px;
    height: 32px;
    border: 1.5px solid rgba(184,146,47,0.45);
    border-radius: 12px;
    display: flex;
    justify-content: center;
    padding-top: 6px;
  }
  .scroll-mouse::after {
    content: '';
    width: 2.5px;
    height: 6px;
    background: var(--gold);
    border-radius: 2px;
    animation: scrollBob 2s ease-in-out infinite;
  }

  /* ─────────────────────────────────────────────────────
     RESPONSIVE — very small phones
  ───────────────────────────────────────────────────── */
  @media (max-width: 360px) {
    .couple-name {
      /* Additional reduction on very narrow screens */
      font-size: 52px;
    }
    .cd-num {
      font-size: 30px;
      width: 58px;
      height: 58px;
    }
    .cta-btn {
      padding: 17px 36px;
      font-size: 13px;
      min-width: 200px;
    }
    .date-pill span { font-size: 11px; }
  }

  /* ─────────────────────────────────────────────────────
     RESPONSIVE — taller phones (iPhone Pro Max, etc.)
     On ≥800px tall screens there's more breathing room.
  ───────────────────────────────────────────────────── */
  @media (min-height: 800px) {
    .hero-body {
      /* Slightly more generous spacing on tall phones */
      justify-content: space-between;
      padding-top: max(52px, env(safe-area-inset-top, 52px));
      max-height: 66svh;
    }
  }
  </style>
</head>
<body>

  <section id="hero" aria-label="Aravind and Meghana Wedding Livestream">

    <!-- Background — exact supplied image, not modified -->
    <div class="hero-bg" role="img" aria-label="Wedding background with temple and floral artwork"></div>

    <!-- ── All hero content, capped at ~67svh (sky safe zone) ── -->
    <div class="hero-body">

      <!-- 7. OM + Sri Maha Ganapataye Namah -->
      <div class="blessing-row">
        <span class="om-symbol" aria-label="Om">ॐ</span>
        <span class="blessing-text">Sri Maha Ganapataye Namah</span>
      </div>

      <!-- Ornamental rule -->
      <div class="ornament-rule" aria-hidden="true"></div>

      <!-- 1. COUPLE NAMES — primary element -->
      <div class="names-block" aria-label="Aravind weds Meghana">
        <span class="couple-name">Aravind</span>
        <span class="weds-text" aria-hidden="true">weds</span>
        <span class="couple-name">Meghana</span>
      </div>

      <!-- 4 & 5. DATE + SUMUHURTHAM + 6. VENUE -->
      <div class="event-details">
        <!-- Date pill -->
        <div class="date-pill">
          <span>Saturday</span>
          <span class="dp" aria-hidden="true"></span>
          <span>20 June 2026</span>
          <span class="dp" aria-hidden="true"></span>
          <span>8:45 AM IST</span>
        </div>
        <!-- Sumuhurtham -->
        <p class="sumuhurtham-line">Sumuhurtham · Vivaha Ceremony</p>
        <!-- Venue — balanced one or two lines -->
        <p class="venue-line">Sri Satyanarayana Kalyana Mandapam, Hyderabad</p>
      </div>

      <!-- 2. COUNTDOWN — inside sky safe zone -->
      <div class="countdown-row" role="timer" aria-label="Countdown to the wedding">
        <div class="cd-block">
          <div class="cd-num" id="cd-d">00</div>
          <div class="cd-label">Days</div>
        </div>
        <span class="cd-sep" aria-hidden="true">:</span>
        <div class="cd-block">
          <div class="cd-num" id="cd-h">00</div>
          <div class="cd-label">Hours</div>
        </div>
        <span class="cd-sep" aria-hidden="true">:</span>
        <div class="cd-block">
          <div class="cd-num" id="cd-m">00</div>
          <div class="cd-label">Mins</div>
        </div>
        <span class="cd-sep" aria-hidden="true">:</span>
        <div class="cd-block">
          <div class="cd-num" id="cd-s">00</div>
          <div class="cd-label">Secs</div>
        </div>
      </div>

      <!-- 3. WATCH LIVE BUTTON -->
      <div class="cta-wrap">
        <!-- Outer pulsing halo ring -->
        <div class="cta-ring" aria-hidden="true"></div>

        <a
          href="#livestream"
          class="cta-btn"
          id="watch-live-btn"
          role="button"
          aria-label="Watch the wedding live stream"
        >
          <span class="live-dot" aria-hidden="true"></span>
          Watch Live
          <svg
            class="cta-arrow"
            width="16" height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
        </a>
      </div>

    </div><!-- /hero-body -->

    <!-- 8. SCROLL INDICATOR — below the safe sky zone, above the lotus -->
    <div class="hero-footer" aria-hidden="true">
      <span class="scroll-label">Scroll</span>
      <div class="scroll-mouse"></div>
    </div>

  </section>

  <script>
  'use strict';

  /* ── Countdown to 20 June 2026, 8:45 AM IST ── */
  const WEDDING = new Date('2026-06-20T08:45:00+05:30');

  function pad(n) { return String(n).padStart(2, '0'); }

  (function tick() {
    const diff = Math.max(0, WEDDING - Date.now());
    document.getElementById('cd-d').textContent = pad(Math.floor(diff / 86400000));
    document.getElementById('cd-h').textContent = pad(Math.floor((diff % 86400000) / 3600000));
    document.getElementById('cd-m').textContent = pad(Math.floor((diff % 3600000)  / 60000));
    document.getElementById('cd-s').textContent = pad(Math.floor((diff % 60000)    / 1000));
    setTimeout(tick, 1000);
  })();

  /* ── Smooth scroll to stream section ── */
  document.getElementById('watch-live-btn').addEventListener('click', function(e) {
    const target = document.getElementById('livestream');
    if (target) {
      e.preventDefault();
      target.scrollIntoView({ behavior: 'smooth' });
    }
  });
  </script>

</body>
</html>
