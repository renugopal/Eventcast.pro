# Test-only SRS configuration: a bare RTMP receiver standing in for
# YouTube in media-delivery-integration-test.sh
# (02_V1_ARCHITECTURE_SPEC.md "YouTube relay": "Use an isolated local
# RTMP sink or pinned test server to validate relay lifecycle ...
# without exposing external credentials"). It accepts any publish under
# the default vhost and does nothing else - no HLS packaging, no
# callbacks, no exporter. This file must never be used for the primary
# ingest SRS instance or any production purpose.

listen              1935;
max_connections     100;
daemon              off;
srs_log_tank        console;

http_api {
    enabled off;
}

http_server {
    enabled off;
}

rtc_server {
    enabled off;
}

vhost __defaultVhost__ {
}
