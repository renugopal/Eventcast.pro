# EventCast Media Node - pinned SRS v6.0-r0 configuration (Phase 0, Task 2).
#
# Image is pinned by exact tag AND immutable digest per
# 04_TECH_STACK_AND_VERSION_POLICY.md ("Production V1 pins ossrs/srs:v6.0-r0
# or its verified immutable digest"). See README.md for the resolved digest
# and validation commands. Do not replace the pinned image with a floating
# tag such as "latest" or "6".
#
# This is a Phase 0/1 skeleton: RTMP ingest + HLS packaging only. SRS
# packages media; it does not own durability, upload, or the public
# manifest (01_SYSTEM_ARCHITECTURE.md, 02_V1_ARCHITECTURE_SPEC.md).

listen              1935;
max_connections     1000;
daemon              off;
srs_log_tank        console;

# HTTP API is for internal control/diagnostics only. It is never published
# to the host or a public interface; it is reachable only from other
# containers on the private Docker network this SRS container joins. See
# README.md "internal callback assumptions".
http_api {
    enabled         on;
    listen          1985;
}

# Not needed in V1: SRS does not serve HLS directly to viewers (the Media
# Agent owns the public manifest) and does not need its own static file
# server, FLV remux, or WebRTC.
http_server {
    enabled         off;
}

rtc_server {
    enabled         off;
}

# Prometheus/OpenMetrics exporter for the monitoring agent. Same isolation
# as http_api: never published to the host, reachable only on the private
# Docker network.
exporter {
    enabled         on;
    listen          9972;
}

vhost __defaultVhost__ {
    hls {
        enabled           on;
        hls_fragment      4;
        hls_window        900;
        hls_wait_keyframe on;
        hls_cleanup       off;
        hls_dispose       0;
        hls_on_error      continue;
        hls_ctx           off;
        hls_ts_ctx        off;
        hls_path          /var/lib/eventcast/srs-output;
        hls_m3u8_file     [app]/[stream]/local.m3u8;
        hls_ts_file       [app]/[stream]/[timestamp]-[seq].ts;
        hls_vcodec        h264;
        hls_acodec        aac;
    }

    http_remux {
        enabled off;
    }

    rtc {
        enabled off;
    }

    # Placeholder callback endpoints matching the Media Agent contract
    # (03_DATA_MODEL_AND_API_CONTRACTS.md "SRS callback contracts"). The
    # hostname "media-agent" is the planned Compose service name on the
    # shared private media-node Docker network - not a public IP and not a
    # loopback address, which would only resolve inside this container's
    # own network namespace.
    http_hooks {
        enabled       on;
        on_publish    http://media-agent:8085/internal/srs/on-publish;
        on_unpublish  http://media-agent:8085/internal/srs/on-unpublish;
        on_hls        http://media-agent:8085/internal/srs/on-hls;
    }
}
