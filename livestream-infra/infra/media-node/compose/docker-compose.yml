# EventCast Media Node - Compose stack (SRS + Media Agent).
#
# SRS is pinned by exact tag and immutable registry digest (see
# ../srs/README.md). The Media Agent image is deliberately required from the
# environment: there is no production default local tag. `deploy.sh` accepts
# only an immutable registry digest for production deployment; isolated test
# scripts pass their own explicitly built local tag and do not call
# `deploy.sh`.
#
# This proves the two containers start, stay healthy, reach each other by
# hostname on a private network, and that the Media Agent's SRS callback
# routes (on-publish/on-hls/on-unpublish) accept real RTMP-publish-driven
# callbacks end to end, now including publish authorization against the
# durable assignment cache and durable segment capture into the protected
# spool - see the README "GCP VM validation commands".
#
# Every value that identifies a host resource (image tag, container name,
# host bind port, host bind path) is overridable via an environment
# variable, all defaulting to the exact persistent single-VM values used
# above. This lets phase2-integration-test.sh and
# ingest-durability-integration-test.sh stand up a fully isolated,
# uniquely-named copy of this same stack - never the persistent deployment
# paths or container names - for automated validation. Do not change the
# defaults; they are the real deployment values.

networks:
  media-node:
    driver: bridge

services:
  media-agent:
    image: "${MEDIA_AGENT_IMAGE:?MEDIA_AGENT_IMAGE must be set to an immutable Media Agent image reference}"
    container_name: ${MEDIA_AGENT_CONTAINER_NAME:-eventcast-media-agent}
    networks:
      media-node: {}
    environment:
      EVENTCAST_NODE_ID: ${EVENTCAST_NODE_ID}
      # 0.0.0.0 so the srs service (a separate container) can reach this
      # service by hostname; the port is still published to the host on
      # loopback only (see "ports" below), so it is never publicly exposed.
      EVENTCAST_MEDIA_AGENT_HTTP_ADDR: 0.0.0.0:8085
      EVENTCAST_LOG_LEVEL: ${EVENTCAST_LOG_LEVEL:-info}
      EVENTCAST_DB_PATH: /var/lib/eventcast/db/media-agent.sqlite3
      EVENTCAST_SPOOL_ROOT: /var/lib/eventcast/spool
      # Same container path the srs service's hls_path writes to
      # (mounted read-only below from the identical host directory the
      # srs service mounts writable), so on_hls file paths validate and
      # completed segments can be hard-linked rather than copied.
      EVENTCAST_SRS_HLS_ROOT: /var/lib/eventcast/srs-output
      # Empty by default: an unseeded agent starts with zero cached
      # assignments (every publish rejected as ASSIGNMENT_MISMATCH) until
      # an operator or test provides a seed file - a later milestone's
      # control-plane client replaces this with continuous sync.
      EVENTCAST_ASSIGNMENT_SEED_PATH: ${EVENTCAST_ASSIGNMENT_SEED_PATH:-}
      EVENTCAST_RECONCILE_INTERVAL: ${EVENTCAST_RECONCILE_INTERVAL:-30s}
      EVENTCAST_SESSION_STALE_TIMEOUT: ${EVENTCAST_SESSION_STALE_TIMEOUT:-180s}
      EVENTCAST_DB_BUSY_TIMEOUT: ${EVENTCAST_DB_BUSY_TIMEOUT:-5s}
      # R2 upload/manifest/VOD/retention subsystem (v1.2 "media
      # delivery"). Empty EVENTCAST_R2_BUCKET (the production default
      # until this rollout is enabled) disables the whole subsystem; see
      # services/media-agent/README.md "Configuration".
      EVENTCAST_R2_ENDPOINT: ${EVENTCAST_R2_ENDPOINT:-}
      EVENTCAST_R2_REGION: ${EVENTCAST_R2_REGION:-auto}
      EVENTCAST_R2_BUCKET: ${EVENTCAST_R2_BUCKET:-}
      EVENTCAST_R2_ACCESS_KEY_ID: ${EVENTCAST_R2_ACCESS_KEY_ID:-}
      EVENTCAST_R2_SECRET_ACCESS_KEY: ${EVENTCAST_R2_SECRET_ACCESS_KEY:-}
      EVENTCAST_R2_OBJECT_PREFIX: ${EVENTCAST_R2_OBJECT_PREFIX:-}
      EVENTCAST_R2_PUBLIC_BASE_URL: ${EVENTCAST_R2_PUBLIC_BASE_URL:-}
      EVENTCAST_R2_UPLOAD_CONCURRENCY: ${EVENTCAST_R2_UPLOAD_CONCURRENCY:-4}
      EVENTCAST_R2_RETRY_BASE_DELAY: ${EVENTCAST_R2_RETRY_BASE_DELAY:-500ms}
      EVENTCAST_R2_RETRY_MAX_DELAY: ${EVENTCAST_R2_RETRY_MAX_DELAY:-30s}
      EVENTCAST_R2_REQUEST_TIMEOUT: ${EVENTCAST_R2_REQUEST_TIMEOUT:-20s}
      EVENTCAST_R2_UPLOAD_LEASE_DURATION: ${EVENTCAST_R2_UPLOAD_LEASE_DURATION:-30s}
      EVENTCAST_R2_INSECURE_SKIP_VERIFY: ${EVENTCAST_R2_INSECURE_SKIP_VERIFY:-false}
      EVENTCAST_DVR_WINDOW: ${EVENTCAST_DVR_WINDOW:-900s}
      EVENTCAST_LOCAL_RETENTION_DELAY: ${EVENTCAST_LOCAL_RETENTION_DELAY:-24h}
      EVENTCAST_MANIFEST_REBUILD_INTERVAL: ${EVENTCAST_MANIFEST_REBUILD_INTERVAL:-5s}
      EVENTCAST_CLEANUP_INTERVAL: ${EVENTCAST_CLEANUP_INTERVAL:-15m}
      # Backblaze B2 authoritative VOD archival. Configuration presence and
      # archival enablement are deliberately separate: a node may hold a
      # complete, valid B2 configuration so the isolated connectivity test
      # can run, while EVENTCAST_B2_ARCHIVE_ENABLED stays false and no real
      # event recording is ever archived. All values come from the host
      # .env, which is never committed.
      EVENTCAST_B2_ENDPOINT: ${EVENTCAST_B2_ENDPOINT:-}
      EVENTCAST_B2_REGION: ${EVENTCAST_B2_REGION:-}
      EVENTCAST_B2_BUCKET: ${EVENTCAST_B2_BUCKET:-}
      EVENTCAST_B2_ACCESS_KEY_ID: ${EVENTCAST_B2_ACCESS_KEY_ID:-}
      EVENTCAST_B2_SECRET_ACCESS_KEY: ${EVENTCAST_B2_SECRET_ACCESS_KEY:-}
      EVENTCAST_B2_OBJECT_PREFIX: ${EVENTCAST_B2_OBJECT_PREFIX:-}
      EVENTCAST_B2_ARCHIVE_ENABLED: ${EVENTCAST_B2_ARCHIVE_ENABLED:-false}
      EVENTCAST_B2_REQUEST_TIMEOUT: ${EVENTCAST_B2_REQUEST_TIMEOUT:-60s}
      EVENTCAST_B2_RETRY_BASE_DELAY: ${EVENTCAST_B2_RETRY_BASE_DELAY:-1s}
      EVENTCAST_B2_RETRY_MAX_DELAY: ${EVENTCAST_B2_RETRY_MAX_DELAY:-60s}
      EVENTCAST_B2_ARCHIVE_INTERVAL: ${EVENTCAST_B2_ARCHIVE_INTERVAL:-30s}
      EVENTCAST_B2_REPORT_INTERVAL: ${EVENTCAST_B2_REPORT_INTERVAL:-30s}
      EVENTCAST_B2_INSECURE_SKIP_VERIFY: ${EVENTCAST_B2_INSECURE_SKIP_VERIFY:-false}
      # Strong byte-integrity verification: none (default),
      # provider_checksum, or read_back. Stays "none" until the isolated
      # connectivity probe proves which mechanism the real endpoint
      # actually supports; an unrecognised value fails startup closed.
      EVENTCAST_B2_INTEGRITY_MODE: ${EVENTCAST_B2_INTEGRITY_MODE:-none}
      # YouTube relay (internal/relay). /usr/local/bin/ffmpeg is the
      # static binary the Dockerfile copies into the distroless runtime
      # image; it is set as an absolute path here rather than relying on
      # the runtime image's PATH.
      EVENTCAST_YOUTUBE_FFMPEG_PATH: ${EVENTCAST_YOUTUBE_FFMPEG_PATH:-/usr/local/bin/ffmpeg}
      EVENTCAST_YOUTUBE_RESTART_MAX_ATTEMPTS: ${EVENTCAST_YOUTUBE_RESTART_MAX_ATTEMPTS:-5}
      EVENTCAST_YOUTUBE_RESTART_BACKOFF_BASE: ${EVENTCAST_YOUTUBE_RESTART_BACKOFF_BASE:-2s}
      EVENTCAST_YOUTUBE_RESTART_BACKOFF_MAX: ${EVENTCAST_YOUTUBE_RESTART_BACKOFF_MAX:-60s}
      # This node's own SRS instance, reachable by its Compose service
      # hostname on the private media-node network - never a public
      # address (02_V1_ARCHITECTURE_SPEC.md "YouTube relay").
      EVENTCAST_YOUTUBE_SOURCE_RTMP_BASE_URL: ${EVENTCAST_YOUTUBE_SOURCE_RTMP_BASE_URL:-rtmp://srs:1935}
      # Control-plane assignment synchronization (internal/controlplane).
      # Empty EVENTCAST_CONTROLPLANE_BASE_URL (the default) disables the
      # subsystem entirely; the agent then relies solely on
      # EVENTCAST_ASSIGNMENT_SEED_PATH above, exactly as before this
      # milestone. See services/media-agent/README.md "Configuration".
      EVENTCAST_CONTROLPLANE_BASE_URL: ${EVENTCAST_CONTROLPLANE_BASE_URL:-}
      EVENTCAST_CONTROLPLANE_NODE_TOKEN: ${EVENTCAST_CONTROLPLANE_NODE_TOKEN:-}
      EVENTCAST_CONTROLPLANE_REQUEST_TIMEOUT: ${EVENTCAST_CONTROLPLANE_REQUEST_TIMEOUT:-10s}
      EVENTCAST_CONTROLPLANE_SYNC_INTERVAL: ${EVENTCAST_CONTROLPLANE_SYNC_INTERVAL:-30s}
      EVENTCAST_CONTROLPLANE_BACKOFF_BASE: ${EVENTCAST_CONTROLPLANE_BACKOFF_BASE:-2s}
      EVENTCAST_CONTROLPLANE_BACKOFF_MAX: ${EVENTCAST_CONTROLPLANE_BACKOFF_MAX:-5m}
      EVENTCAST_CONTROLPLANE_STALE_WARN_AFTER: ${EVENTCAST_CONTROLPLANE_STALE_WARN_AFTER:-5m}
      EVENTCAST_CONTROLPLANE_STALE_CRITICAL_AFTER: ${EVENTCAST_CONTROLPLANE_STALE_CRITICAL_AFTER:-20m}
      # Empty by default: the VOD finalize and vod-gap operator endpoints
      # are then reachable without authentication (a startup warning is
      # logged) - acceptable only because they are never bound publicly
      # (see "ports" below). Production must set this.
      EVENTCAST_OPERATOR_API_TOKEN: ${EVENTCAST_OPERATOR_API_TOKEN:-}
      EVENTCAST_RATE_LIMIT_RPS: ${EVENTCAST_RATE_LIMIT_RPS:-20}
      EVENTCAST_RATE_LIMIT_BURST: ${EVENTCAST_RATE_LIMIT_BURST:-40}
      # Must stay false unless a trusted reverse proxy this deployment
      # controls sits in front of this agent and itself strips any
      # client-supplied X-Forwarded-For before setting its own.
      EVENTCAST_TRUSTED_PROXY_ENABLED: ${EVENTCAST_TRUSTED_PROXY_ENABLED:-false}
    volumes:
      - ${SPOOL_HOST_DIR:-/opt/eventcast/media-node/data/spool}:/var/lib/eventcast/spool
      - ${DB_HOST_DIR:-/opt/eventcast/media-node/data/db}:/var/lib/eventcast/db
      # Read-only: the Media Agent only ever reads from and hard-links
      # out of SRS's staging output, never writes into it.
      - ${SRS_OUTPUT_HOST_DIR:-/opt/eventcast/media-node/data/srs}:/var/lib/eventcast/srs-output:ro
      # Directory (not file) bind so a not-yet-provisioned host path is
      # safely auto-created empty rather than tripping the Docker
      # bind-mount footgun where a missing *file* source becomes a
      # directory. EVENTCAST_ASSIGNMENT_SEED_PATH stays empty by default
      # regardless, so this mount is inert until both are set together.
      - ${ASSIGNMENT_SEED_HOST_DIR:-/opt/eventcast/media-node/config/assignments}:/var/lib/eventcast/config:ro
    ports:
      - "${MEDIA_AGENT_HTTP_HOST_BIND:-127.0.0.1:8085}:8085"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/media-agent", "healthcheck"]
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3
    # Security hardening (this milestone's runtime/deployment review):
    # the image already runs as the non-root distroless "nonroot" user
    # (see ../../../services/media-agent/Dockerfile); these Compose-level
    # settings add defense in depth on top of that. A read-only root
    # filesystem is feasible because every path the process writes to
    # (spool, db, and the OS temp dir SQLite/Go may use for scratch
    # files) is an explicit volume or tmpfs mount below, not the
    # container's own writable layer.
    read_only: true
    tmpfs:
      - /tmp:uid=65532,gid=65532,mode=1770,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  srs:
    image: ossrs/srs@sha256:4e293846ad2448ff1a0157aa2c694e7c451fff5046c93b5bc6da0fa0384ef998
    container_name: ${SRS_CONTAINER_NAME:-eventcast-srs}
    networks:
      media-node: {}
    depends_on:
      media-agent:
        condition: service_healthy
    # The exact pinned image was validated with this wrapper: umask 0027
    # produces root:65532 directories (2750) and HLS files (0640) beneath
    # the set-group-ID SRS output directory, then exec preserves SRS as PID 1.
    command: ["/bin/sh", "-c", "umask 0027; exec ./objs/srs -c conf/eventcast.conf"]
    volumes:
      - ${SRS_CONF_HOST_PATH:-/opt/eventcast/media-node/config/srs/srs.conf}:/usr/local/srs/conf/eventcast.conf:ro
      - ${SRS_OUTPUT_HOST_DIR:-/opt/eventcast/media-node/data/srs}:/var/lib/eventcast/srs-output
    ports:
      # RTMP ingest only. HTTP API (1985) and the exporter (9972) are
      # intentionally absent from this list - see ../srs/README.md
      # "Required ports".
      - "${SRS_RTMP_HOST_BIND:-1935}:1935"
    restart: unless-stopped
    healthcheck:
      # No curl/wget/python3 in the SRS image; a bash /dev/tcp probe
      # against the container-local HTTP API is a liveness check only,
      # not a use of the API from outside the container.
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/1985"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3
    # Security hardening: capabilities and privilege escalation are
    # dropped unconditionally (safe regardless of image internals - SRS
    # never binds a port below 1024 or needs raw sockets). A read-only
    # root filesystem is deliberately NOT applied here: this is a
    # third-party image (unlike media-agent's own Dockerfile, whose
    # filesystem needs are fully known), `srs_log_tank console` and
    # `daemon off` avoid the log/pid-file writes that would be the most
    # likely blocker, but forcing read_only without an exact-image
    # startup/publish/callback smoke test under that constraint risks
    # silently breaking ingest per ADR-022 ("SRS configuration snippets
    # require exact-image validation"). Revisit with that test before
    # enabling read_only here.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
