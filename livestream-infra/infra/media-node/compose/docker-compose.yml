# EventCast Media Node - Compose stack (SRS + Media Agent).
#
# Both images are pinned: SRS by exact tag AND immutable registry digest
# (see ../srs/README.md), Media Agent by the exact local build tag produced
# in validation (see ../../../services/media-agent/README.md). Do not
# replace either reference with a floating tag.
#
# This proves the two containers start, stay healthy, reach each other by
# hostname on a private network, and that the Media Agent's SRS callback
# routes (on-publish/on-hls/on-unpublish) accept real RTMP-publish-driven
# callbacks end to end, now including publish authorization against the
# durable assignment cache and durable segment capture into the protected
# spool - see the README "GCP VM validation commands".
#
# Every value that identifies a host resource (image tag, container name,
# host bind port, host bind path) is overridable via an environment
# variable, all defaulting to the exact persistent single-VM values used
# above. This lets phase2-integration-test.sh and
# ingest-durability-integration-test.sh stand up a fully isolated,
# uniquely-named copy of this same stack - never the persistent deployment
# paths or container names - for automated validation. Do not change the
# defaults; they are the real deployment values.

networks:
  media-node:
    driver: bridge

services:
  media-agent:
    image: ${MEDIA_AGENT_IMAGE:-media-agent:phase0-task3}
    container_name: ${MEDIA_AGENT_CONTAINER_NAME:-eventcast-media-agent}
    networks:
      media-node: {}
    environment:
      EVENTCAST_NODE_ID: ${EVENTCAST_NODE_ID}
      # 0.0.0.0 so the srs service (a separate container) can reach this
      # service by hostname; the port is still published to the host on
      # loopback only (see "ports" below), so it is never publicly exposed.
      EVENTCAST_MEDIA_AGENT_HTTP_ADDR: 0.0.0.0:8085
      EVENTCAST_LOG_LEVEL: ${EVENTCAST_LOG_LEVEL:-info}
      EVENTCAST_DB_PATH: /var/lib/eventcast/db/media-agent.sqlite3
      EVENTCAST_SPOOL_ROOT: /var/lib/eventcast/spool
      # Same container path the srs service's hls_path writes to
      # (mounted read-only below from the identical host directory the
      # srs service mounts writable), so on_hls file paths validate and
      # completed segments can be hard-linked rather than copied.
      EVENTCAST_SRS_HLS_ROOT: /var/lib/eventcast/srs-output
      # Empty by default: an unseeded agent starts with zero cached
      # assignments (every publish rejected as ASSIGNMENT_MISMATCH) until
      # an operator or test provides a seed file - a later milestone's
      # control-plane client replaces this with continuous sync.
      EVENTCAST_ASSIGNMENT_SEED_PATH: ${EVENTCAST_ASSIGNMENT_SEED_PATH:-}
      EVENTCAST_RECONCILE_INTERVAL: ${EVENTCAST_RECONCILE_INTERVAL:-30s}
      EVENTCAST_SESSION_STALE_TIMEOUT: ${EVENTCAST_SESSION_STALE_TIMEOUT:-180s}
      EVENTCAST_DB_BUSY_TIMEOUT: ${EVENTCAST_DB_BUSY_TIMEOUT:-5s}
    volumes:
      - ${SPOOL_HOST_DIR:-/opt/eventcast/media-node/data/spool}:/var/lib/eventcast/spool
      - ${DB_HOST_DIR:-/opt/eventcast/media-node/data/db}:/var/lib/eventcast/db
      # Read-only: the Media Agent only ever reads from and hard-links
      # out of SRS's staging output, never writes into it.
      - ${SRS_OUTPUT_HOST_DIR:-/opt/eventcast/media-node/data/srs}:/var/lib/eventcast/srs-output:ro
      # Directory (not file) bind so a not-yet-provisioned host path is
      # safely auto-created empty rather than tripping the Docker
      # bind-mount footgun where a missing *file* source becomes a
      # directory. EVENTCAST_ASSIGNMENT_SEED_PATH stays empty by default
      # regardless, so this mount is inert until both are set together.
      - ${ASSIGNMENT_SEED_HOST_DIR:-/opt/eventcast/media-node/config/assignments}:/var/lib/eventcast/config:ro
    ports:
      - "${MEDIA_AGENT_HTTP_HOST_BIND:-127.0.0.1:8085}:8085"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/media-agent", "healthcheck"]
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3

  srs:
    image: ossrs/srs@sha256:4e293846ad2448ff1a0157aa2c694e7c451fff5046c93b5bc6da0fa0384ef998
    container_name: ${SRS_CONTAINER_NAME:-eventcast-srs}
    networks:
      media-node: {}
    depends_on:
      media-agent:
        condition: service_healthy
    command: ["./objs/srs", "-c", "conf/eventcast.conf"]
    volumes:
      - ${SRS_CONF_HOST_PATH:-/opt/eventcast/media-node/config/srs/srs.conf}:/usr/local/srs/conf/eventcast.conf:ro
      - ${SRS_OUTPUT_HOST_DIR:-/opt/eventcast/media-node/data/srs}:/var/lib/eventcast/srs-output
    ports:
      # RTMP ingest only. HTTP API (1985) and the exporter (9972) are
      # intentionally absent from this list - see ../srs/README.md
      # "Required ports".
      - "${SRS_RTMP_HOST_BIND:-1935}:1935"
    restart: unless-stopped
    healthcheck:
      # No curl/wget/python3 in the SRS image; a bash /dev/tcp probe
      # against the container-local HTTP API is a liveness check only,
      # not a use of the API from outside the container.
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/1985"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3
